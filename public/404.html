<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Vaishnav Valsaraj</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap"
    />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      :root { --paper: #f3efe6; --ink: #141414; --muted: #615c55; --rule: rgba(20, 20, 20, 0.14); --accent: #c23a22; }
      .dark { --paper: #121110; --ink: #ede8de; --muted: #9d978c; --rule: rgba(237, 232, 222, 0.14); --accent: #ff6a4d; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh; display: flex; flex-direction: column; justify-content: space-between;
        padding: 40px 16px; background: var(--paper); color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      }
      main, footer { width: 100%; max-width: 72rem; margin: 0 auto; }
      .meta { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      h1 { margin-top: 24px; font-family: "Instrument Serif", ui-serif, Georgia, serif; font-weight: 400; font-size: clamp(4rem, 16vw, 10rem); line-height: 0.9; letter-spacing: -0.02em; }
      h1 em { color: var(--accent); }
      p.lead { margin-top: 24px; max-width: 28rem; color: var(--muted); }
      a.home { display: inline-block; margin-top: 32px; padding: 8px 16px; border-radius: 9999px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; text-decoration: none; transition: background-color 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
      a.home:hover { background: var(--accent); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      footer { border-top: 1px solid var(--rule); padding-top: 16px; }
      @media (min-width: 768px) { body { padding: 56px 32px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="meta">Error 404</p>
      <h1>Page not <em>found.</em></h1>
      <p class="lead">This link doesn't lead anywhere. The rest of the site is one page away.</p>
      <a class="home" href="/">Back to the homepage</a>
    </main>
    <footer><p class="meta">© Vaishnav Valsaraj</p></footer>
  </body>
</html>
